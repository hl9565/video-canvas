server {
    listen 80;
    server_name _;

    set $forwarded_proto $http_x_forwarded_proto;
    if ($forwarded_proto = "") {
        set $forwarded_proto $scheme;
    }

    root /usr/share/nginx/html;
    index index.html;

    # CPU 预览流直出（Range / HTTP 206）且同时禁用 access log 与隔离 error log，
    # 覆盖大小写、斜杠变体及子路径，避免短期 query token 在正常、拒绝或上游失败时落入日志
    location ~* ^/api/v1/dramas/(?:[^/]+/)*episodes/(?:[^/]+/)*preview/(?:[^/]+/)*stream(?:[^a-zA-Z0-9_-].*)?$ {
        access_log off;
        error_log /dev/null emerg;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_send_timeout 600s;
        proxy_read_timeout 600s;
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Range $http_range;
        proxy_set_header If-Range $http_if_range;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
    }

    location /api/ {
        # nginx 默认只放行 1MB 请求体，超过会直接断开连接；技能包导入（zip 最大 50MB、文件夹合计最大 100MB）
        # 和素材中转上传都会超过它。上限与后端保持一致，真正的大小校验仍由后端负责
        client_max_body_size 110m;
        # 大文件边收边转给后端，不先落到 nginx 的临时文件
        proxy_request_buffering off;
        proxy_send_timeout 600s;
        proxy_read_timeout 600s;
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
    }

    location /files/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /api/v1/ws {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
